name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VanDerTil.Keycloak.Client.slnx --locked-mode

      - name: Build
        run: dotnet build VanDerTil.Keycloak.Client.slnx --configuration Release --nologo --no-restore

      - name: Test
        run: dotnet test VanDerTil.Keycloak.Client.slnx --configuration Release --nologo --no-build

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VanDerTil.Keycloak.Client.slnx --locked-mode

      - name: Build
        run: dotnet build VanDerTil.Keycloak.Client.slnx --configuration Release --nologo --no-restore

      - name: Pack
        run: dotnet pack src/VanDerTil.Keycloak.Client/VanDerTil.Keycloak.Client.csproj --configuration Release --nologo --no-build --output ./nupkg

      - name: Publish to GitHub Packages
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate
